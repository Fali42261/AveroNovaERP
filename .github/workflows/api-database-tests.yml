name: API database tests

on:
  pull_request:
    branches:
      - AuthModule
      - AveroNovaERP
  push:
    branches:
      - feature/api-database-foundation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AveroNova.API.Tests/AveroNova.API.Tests.csproj

      - name: Test API and database
        run: dotnet test AveroNova.API.Tests/AveroNova.API.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=api-database.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-database-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
