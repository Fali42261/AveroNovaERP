name: SwapDigit Android Build

on:
  pull_request:
    branches:
      - swapDigit
  push:
    branches:
      - swapDigit

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android target
        run: dotnet restore AveroNova.App.UI/AveroNova.App.UI.csproj -p:AveroNovaCiTargetFramework=net10.0-android

      - name: Build Android target
        run: dotnet build AveroNova.App.UI/AveroNova.App.UI.csproj -c Debug -f net10.0-android -p:AveroNovaCiTargetFramework=net10.0-android --no-restore

      - name: Collect installable APK
        shell: bash
        run: |
          mkdir -p artifacts
          find AveroNova.App.UI/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp {} artifacts/ \;
          echo 'APK files:'
          find artifacts -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload SwapDigit Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SwapDigit-Android-Test-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
