name: MAUI Android Build

on:
  pull_request:
    branches:
      - AveroNovaERP
  push:
    branches:
      - fix/free-dashboard-navigation

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android target
        run: dotnet restore AveroNova.App.UI/AveroNova.App.UI.csproj -p:AveroNovaCiTargetFramework=net10.0-android

      - name: Build Android target
        run: dotnet build AveroNova.App.UI/AveroNova.App.UI.csproj -c Debug -f net10.0-android -p:AveroNovaCiTargetFramework=net10.0-android --no-restore
