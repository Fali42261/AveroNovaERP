name: MAUI Windows Build

on:
  pull_request:
    branches:
      - AveroNovaERP
  push:
    branches:
      - fix/offline-banner-phone-placeholders

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        shell: pwsh
        run: dotnet workload install maui

      - name: Restore Windows target
        shell: pwsh
        run: dotnet restore AveroNova.App.UI/AveroNova.App.UI.csproj -p:AveroNovaCiTargetFramework=net10.0-windows10.0.19041.0

      - name: Publish Windows x64 unpackaged app
        shell: pwsh
        run: dotnet publish AveroNova.App.UI/AveroNova.App.UI.csproj -c Release -f net10.0-windows10.0.19041.0 -p:AveroNovaCiTargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:WindowsPackageType=None --no-restore -o artifacts/SwapDigit-Windows-x64

      - name: Verify Windows package
        shell: pwsh
        run: |
          Get-ChildItem artifacts/SwapDigit-Windows-x64 -Recurse
          $exe = Get-ChildItem artifacts/SwapDigit-Windows-x64 -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'No Windows executable was produced.' }
          Write-Host "Windows executable: $($exe.FullName)"

      - name: Upload SwapDigit Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: SwapDigit-Windows-x64
          path: artifacts/SwapDigit-Windows-x64/**
          if-no-files-found: error
          retention-days: 14
